<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="icon" type="image/png" href="https://w7.pngwing.com/pngs/646/324/png-transparent-github-computer-icons-github-logo-monochrome-head-thumbnail.png">
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div class="login-box">
        <img   class="img-git"  src="https://static-00.iconduck.com/assets.00/github-inverted-icon-2048x1993-qoeck9vw.png" alt="github">
        <div class="sign-text">Sign in to GitHub</div><br><br>
        <div class="sign-box">
            
            <label class="credentials1" for="username">Username or email address</label>
            <input class="credentials" type="email"> <br>
            <label class="credentials1" for="username">Password</label> <label class="forgot" for="forgot">Forgot Password?</label>
            <br><input class="credentials" type="password"><br>
            <input class="sign-in" type="submit" value="Sign in">
            
        </div>
        <div class="new-accnt">
            <p class="New">New to GitHub? <span class="create">Create an Account.</span></p>
        </div>
        <br><br><br>
        <br>
        <p class="terms">Terms <span class="privacy">Privacy</span> <span class="privacy">Security</span><span class="contact">Contact GitHub</span></p>
    </div>
</body>
</html>
